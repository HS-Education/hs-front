<div class="login-container min-h-screen flex items-center justify-center px-4 relative bg-[var(--bg-primary)]">
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    aria-describedby="login-error"
    class="w-full max-w-md rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-8 shadow-md relative"
  >
    <div class="mb-8 text-center">
      <!-- Logo HS Education (match navbar) -->
      <div class="flex items-center justify-center gap-3 mb-6">
        <div
          class="flex h-10 w-10 items-center justify-center rounded-xl bg-[var(--brand-mark-bg)] shadow-lg shadow-[var(--brand-primary)]/10 text-[var(--brand-mark-text)] font-bold text-lg"
        >
          HS
        </div>
        <div>
          <h1 class="text-md font-bold tracking-tight text-[var(--brand-primary)]">
            HS Education
          </h1>
        </div>
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-[var(--text-primary)]">{{ 'UI_TEXT.WELCOME' | transloco }}</h1>
      <p class="mt-1.5 text-xs text-[var(--text-secondary)] font-medium">{{ 'UI_TEXT.PERSONALIZED_LEARNING_PLATFORM' | transloco }}</p>
    </div>

    <!-- Username Input Group -->
    <div class="relative mb-5">
      <input
        id="username"
        type="text"
        formControlName="username"
        placeholder=" "
        class="peer w-full rounded-xl theme-input pl-10 pr-4 pt-5 pb-1.5 text-sm outline-none placeholder-transparent"
      />
      <span class="absolute left-3.5 top-1/2 -translate-y-1/2 flex items-center pointer-events-none text-[var(--text-secondary)]/70 transition-all duration-300 peer-focus:text-[var(--brand-primary)]">
        <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </span>
      <label
        for="username"
        class="absolute left-10 top-1/2 -translate-y-1/2 text-sm text-[var(--text-secondary)]/70 transition-all duration-300 pointer-events-none select-none
               peer-focus:top-1.5 peer-focus:-translate-y-0 peer-focus:text-[10px] peer-focus:font-bold peer-focus:text-[var(--brand-primary)]
               peer-[:not(:placeholder-shown)]:top-1.5 peer-[:not(:placeholder-shown)]:-translate-y-0 peer-[:not(:placeholder-shown)]:text-[10px] peer-[:not(:placeholder-shown)]:font-bold"
      >
        {{ 'UI_TEXT.USERNAME' | transloco }}
      </label>
    </div>

    <!-- Password Input Group -->
    <div class="relative mb-6">
      <input
        id="password"
        type="password"
        formControlName="password"
        placeholder=" "
        class="peer w-full rounded-xl theme-input pl-10 pr-4 pt-5 pb-1.5 text-sm outline-none placeholder-transparent"
      />
      <span class="absolute left-3.5 top-1/2 -translate-y-1/2 flex items-center pointer-events-none text-[var(--text-secondary)]/70 transition-all duration-300 peer-focus:text-[var(--brand-primary)]">
        <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </span>
      <label
        for="password"
        class="absolute left-10 top-1/2 -translate-y-1/2 text-sm text-[var(--text-secondary)]/70 transition-all duration-300 pointer-events-none select-none
               peer-focus:top-1.5 peer-focus:-translate-y-0 peer-focus:text-[10px] peer-focus:font-bold peer-focus:text-[var(--brand-primary)]
               peer-[:not(:placeholder-shown)]:top-1.5 peer-[:not(:placeholder-shown)]:-translate-y-0 peer-[:not(:placeholder-shown)]:text-[10px] peer-[:not(:placeholder-shown)]:font-bold"
      >
        {{ 'ADMIN.USERS.PASSWORD' | transloco }}
      </label>
    </div>

    <!-- Submit Button with loading animation and hover effects -->
    <button
      type="submit"
      [disabled]="loading() || form.invalid"
      class="flex w-full items-center justify-center gap-2 rounded-xl bg-[var(--button-primary-bg)] hover:bg-[var(--button-primary-hover)] px-4 py-3.5 text-sm font-bold text-[var(--button-primary-text)] shadow-lg shadow-[var(--brand-primary)]/20 hover:shadow-[var(--brand-primary)]/30 transition-all duration-300 active:scale-[0.98] disabled:cursor-not-allowed disabled:bg-[var(--bg-secondary)] disabled:text-[var(--text-secondary)]/40 disabled:border disabled:border-[var(--border)]/30 disabled:shadow-none"
    >
      @if (loading()) {
        <svg class="h-5 w-5 animate-spin text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>{{ 'UI_TEXT.SIGNING_IN' | transloco }}</span>
      } @else {
        <span>{{ 'UI_TEXT.SIGN_IN' | transloco }}</span>
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      }
    </button>

    <!-- Beautiful visual alerts for error messages -->
    @if (errorMessage()) {
      <div
        id="login-error"
        role="alert"
        class="mt-6 flex items-start gap-3 rounded-xl border border-[var(--brand-error)]/20 bg-[var(--brand-error)]/10 px-4 py-3.5 text-xs text-[var(--brand-error)] animate-fadeIn"
      >
        <svg class="h-5 w-5 shrink-0 text-[var(--brand-error)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span class="font-medium leading-relaxed">{{ errorMessage() }}</span>
      </div>
    }
  </form>
</div>
