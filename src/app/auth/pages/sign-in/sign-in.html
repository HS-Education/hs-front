<div class="login-container min-h-screen flex items-center justify-center px-4 relative bg-[var(--bg-primary)]">
  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    aria-describedby="login-error"
    class="w-full max-w-md rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-8 shadow-md relative"
  >
    <div class="mb-8 text-center">
      <!-- Premium App Logo Emblem -->
      <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-tr from-[var(--brand-primary)] to-[var(--brand-primary-hover)] shadow-lg shadow-[var(--brand-primary)]/25 text-white font-extrabold text-2xl tracking-tighter">
        HS
      </div>
      <h1 class="text-2xl font-extrabold tracking-tight text-[var(--text-primary)]">Bienvenido</h1>
      <p class="mt-1.5 text-xs text-[var(--text-secondary)] font-medium">Plataforma de Aprendizaje Personalizado</p>
    </div>

    <!-- Username Input Group -->
    <div class="mb-5">
      <label for="username" class="mb-1.5 block text-xs font-semibold text-[var(--text-secondary)] uppercase tracking-wider">
        Usuario o Email
      </label>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-[var(--text-secondary)]/70">
          <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </span>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="nombreusuario"
          class="w-full rounded-xl theme-input pl-10 pr-4 py-3 text-sm outline-none"
        />
      </div>
    </div>

    <!-- Password Input Group -->
    <div class="mb-6">
      <div class="flex items-center justify-between mb-1.5">
        <label for="password" class="block text-xs font-semibold text-[var(--text-secondary)] uppercase tracking-wider">
          Contraseña
        </label>
      </div>
      <div class="relative">
        <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-[var(--text-secondary)]/70">
          <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </span>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          class="w-full rounded-xl theme-input pl-10 pr-4 py-3 text-sm outline-none"
        />
      </div>
    </div>

    <!-- Submit Button with loading animation and hover effects -->
    <button
      type="submit"
      [disabled]="loading() || form.invalid"
      class="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-[var(--brand-primary)] to-[var(--brand-primary-hover)] hover:from-[var(--brand-primary-hover)] hover:to-[var(--brand-primary)] px-4 py-3.5 text-sm font-bold text-white shadow-lg shadow-[var(--brand-primary)]/20 hover:shadow-[var(--brand-primary)]/30 transition-all duration-300 active:scale-[0.98] disabled:cursor-not-allowed disabled:from-[var(--bg-secondary)] disabled:to-[var(--bg-secondary)] disabled:text-[var(--text-secondary)]/40 disabled:border disabled:border-[var(--border)]/30 disabled:shadow-none"
    >
      @if (loading()) {
        <svg class="h-5 w-5 animate-spin text-white" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>Ingresando...</span>
      } @else {
        <span>Ingresar</span>
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      }
    </button>

    <!-- Beautiful visual alerts for error messages -->
    @if (errorMessage()) {
      <div
        id="login-error"
        role="alert"
        class="mt-6 flex items-start gap-3 rounded-xl border border-[var(--brand-error)]/20 bg-[var(--brand-error)]/10 px-4 py-3.5 text-xs text-[var(--brand-error)] animate-fadeIn"
      >
        <svg class="h-5 w-5 shrink-0 text-[var(--brand-error)]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span class="font-medium leading-relaxed">{{ errorMessage() }}</span>
      </div>
    }
  </form>
</div>
