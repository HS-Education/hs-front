<div class="space-y-4">
  @if (loading()) {
    <div class="flex items-center justify-center py-12">
      <div class="space-y-2 text-center">
        <div class="inline-flex h-8 w-8 animate-spin rounded-full border-4 border-slate-200 border-t-sky-600"></div>
        <p class="text-sm text-slate-500">Cargando miembros...</p>
      </div>
    </div>
  } @else if (error()) {
    <div class="rounded-lg border border-red-200 bg-red-50 p-4">
      <p class="text-sm font-medium text-red-900">{{ error() }}</p>
    </div>
  } @else if (members().length === 0) {
    <div class="rounded-lg border border-dashed border-slate-300 bg-slate-50 py-12 text-center">
      <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 20h5v-2a4 4 0 00-4-4h-1m-4 6H7m6 0v-2c0-1.657-1.343-3-3-3H7a3 3 0 00-3 3v2m14-6v-2a4 4 0 00-4-4h-1m-4 6a4 4 0 11-8 0 4 4 0 018 0zm6-10a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <p class="mt-2 text-sm text-slate-500">No hay miembros disponibles</p>
    </div>
  } @else {
    <div class="overflow-hidden rounded-lg border border-slate-200 shadow-sm">
      <table class="w-full">
        <thead class="border-b border-slate-200 bg-slate-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-700">Usuario</th>
          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-700">Rol</th>
<!--          <th class="px-6 py-3 text-left text-xs font-medium uppercase tracking-wider text-slate-700">ID</th>-->
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-200">
          @for (member of members(); track member.userId) {
            <tr class="transition hover:bg-slate-50">
              <td class="px-6 py-4">
                <p class="text-sm font-medium text-slate-900">{{ member.userName }}</p>
              </td>
              <td class="px-6 py-4">
                <span class="inline-flex items-center rounded-full bg-blue-50 px-3 py-1 text-xs font-medium text-blue-700">
                  {{ member.roleInClassroom }}
                </span>
              </td>
<!--              <td class="px-6 py-4">-->
<!--                <p class="text-sm text-slate-500">{{ member.userId }}</p>-->
<!--              </td>-->
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
