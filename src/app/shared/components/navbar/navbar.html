<nav class="w-64 bg-slate-900 text-white shadow-lg flex flex-col h-screen overflow-y-auto">
  <!-- Header -->
  <div class="p-6 border-b border-slate-700">
    <h1 class="text-xl font-bold">HS</h1>
    <p class="text-xs text-slate-400 mt-1">Sistema</p>
  </div>

  <!-- User Info -->
  <div class="p-4 border-b border-slate-700">
    @if (userProfile(); as user) {
      <div class="text-sm">
        <p class="font-semibold text-slate-100">{{ user.username }}</p>
        <p class="text-xs text-slate-400 mt-1">ID: {{ user.id }}</p>
        @if (user.roles.length > 0) {
          <div class="mt-2 space-y-1">
            @for (role of user.roles; track role) {
              <span class="inline-block px-2 py-1 bg-blue-600 text-xs rounded">
                {{ role }}
              </span>
            }
          </div>
        }
      </div>
    } @else {
      <p class="text-sm text-slate-400">No autenticado</p>
    }
  </div>

  <!-- Navigation Links -->
  <div class="flex-1 p-4 space-y-2">
    <a routerLink="/home" class="block px-4 py-2 rounded-lg text-slate-200 hover:bg-slate-800 transition">
      Inicio
    </a>
    <a routerLink="/courses" class="block px-4 py-2 rounded-lg text-slate-200 hover:bg-slate-800 transition">
      Cursos
    </a>
    <a routerLink="/repository" class="block px-4 py-2 rounded-lg text-slate-200 hover:bg-slate-800 transition">
      Repositorio
    </a>
  </div>

  <!-- Logout Button -->
  <div class="p-4 border-t border-slate-700">
    <button
      type="button"
      (click)="onLogOut()"
      class="w-full px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-sm font-semibold text-white transition"
    >
      Cerrar sesión
    </button>
  </div>
</nav>
