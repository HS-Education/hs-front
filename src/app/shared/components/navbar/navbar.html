<nav class="flex h-screen w-64 flex-col overflow-y-auto bg-slate-900 text-white shadow-lg">
  <!-- Header -->
  <div class="border-b border-slate-700 p-6">
    <h1 class="text-xl font-bold">HS</h1>
    <p class="mt-1 text-xs text-slate-400">Sistema</p>
  </div>

  <!-- User Info -->
  <div class="border-b border-slate-700 p-4">
    @if (!userDataService.isSessionLoaded()) {
      <p class="text-sm text-slate-400">Cargando sesión...</p>
    } @else if (userProfile(); as user) {
      <div class="text-sm">
        <p class="font-semibold text-slate-100">{{ user.username }}</p>
        <p class="mt-1 text-xs text-slate-400">ID: {{ user.id }}</p>

        @if (user.roles.length > 0) {
          <div class="mt-2 space-y-1">
            @for (role of user.roles; track role) {
              <span class="inline-block rounded bg-blue-600 px-2 py-1 text-xs">
                {{ role }}
              </span>
            }
          </div>
        }
      </div>
    } @else {
      <p class="text-sm text-slate-400">No autenticado</p>
    }
  </div>

  <!-- Navigation Links -->
  <div class="flex-1 space-y-2 p-4">
    <a routerLink="/home" class="block rounded-lg px-4 py-2 text-slate-200 transition hover:bg-slate-800">
      Inicio
    </a>
    <a routerLink="/classrooms" class="block rounded-lg px-4 py-2 text-slate-200 transition hover:bg-slate-800">
      Cursos
    </a>
    <a routerLink="/repository" class="block rounded-lg px-4 py-2 text-slate-200 transition hover:bg-slate-800">
      Repositorio
    </a>
  </div>

  <!-- Logout Button -->
  <div class="border-t border-slate-700 p-4">
    <button
      type="button"
      (click)="onLogOut()"
      class="w-full rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-red-700"
    >
      Cerrar sesión
    </button>
  </div>
</nav>
