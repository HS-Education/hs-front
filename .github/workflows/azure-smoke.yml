name: Azure browser smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    if: vars.AZURE_CD_ENABLED == 'true' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: azure-students
    env:
      PLAYWRIGHT_BASE_URL: ${{ vars.AZURE_FRONTEND_URL }}
      PLAYWRIGHT_API_BASE_URL: ${{ vars.AZURE_API_BASE_URL }}
      SMOKE_USERNAME: ${{ secrets.SMOKE_USERNAME }}
      SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.0.8
          runtime: node@22
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Require explicit cloud targets
        shell: bash
        run: |
          [[ "$PLAYWRIGHT_BASE_URL" == https://* ]]
          [[ "$PLAYWRIGHT_API_BASE_URL" == https://*/api/v1 ]]
          [[ -n "$SMOKE_USERNAME" && -n "$SMOKE_PASSWORD" ]]
          node -e 'const front = new URL(process.env.PLAYWRIGHT_BASE_URL); const api = new URL(process.env.PLAYWRIGHT_API_BASE_URL); if (!front.hostname.startsWith("hs-thesis-api-") || !front.hostname.endsWith(".azurewebsites.net") || front.origin !== api.origin || front.username || front.password || api.username || api.password || front.search || front.hash || api.search || api.hash) throw new Error("An expected same-origin App Service target is required before sending credentials.");'
      - name: Verify cloud login, secure cookies and deep-link reload
        run: pnpm exec playwright test e2e/login.smoke.spec.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cloud-smoke-report
          path: test-results/playwright-junit.xml
          retention-days: 7
