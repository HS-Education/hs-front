name: Frontend Azure release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag integrated into main
        required: true
        type: string
      hosting:
        description: App Service packages the frontend with Java; SWA requires a validated domain strategy
        required: true
        default: app-service
        type: choice
        options: [app-service, swa]

permissions:
  contents: read

concurrency:
  group: frontend-azure-release
  cancel-in-progress: false

jobs:
  release:
    if: vars.AZURE_CD_ENABLED == 'true' && github.ref_type == 'tag' && github.ref_name == inputs.release_tag
    runs-on: ubuntu-latest
    environment: azure-students
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      AZURE_API_BASE_URL: ${{ inputs.hosting == 'app-service' && '/api/v1' || vars.AZURE_API_BASE_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Verify release ancestry
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main
      - uses: pnpm/setup@v3
        with:
          version: 11.0.8
          runtime: node@22
          cache: true
          install: false
      - name: Verify and build public frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm test:deployment
          node scripts/check-i18n.cjs
          pnpm build:azure
          python3 scripts/package-release.py
      - name: Publish immutable release assets for backend CD
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes "Verified frontend deployment artifact."
          fi
          gh release upload "$RELEASE_TAG" dist/frontend.zip dist/frontend-manifest.json --repo "$GITHUB_REPOSITORY"
      - name: Authenticate for optional SWA deployment
        if: inputs.hosting == 'swa'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Verify optional SWA target and login prerequisites
        if: inputs.hosting == 'swa'
        shell: pwsh
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SWA_LOGIN_VALIDATED: ${{ vars.AZURE_SWA_LOGIN_VALIDATED }}
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: ./infra/azure/Verify-SwaTarget.ps1
      - name: Deploy to Static Web Apps only when explicitly selected
        if: inputs.hosting == 'swa'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist/hs-tesis-front/browser
          skip_app_build: true
          skip_api_build: true
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-release-${{ inputs.release_tag }}
          path: |
            dist/frontend.zip
            dist/frontend-manifest.json
